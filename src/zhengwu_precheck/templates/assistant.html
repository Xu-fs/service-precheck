<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>材料准备与人工协作 · 政务易办</title><link rel="stylesheet" href="/static/css/staff.css"><script type="module" src="/static/js/assistant.js"></script></head><body><main class="staff-content"><a href="/">指南咨询 / 登录</a> · <a href="/my/tickets">我的人工工单</a><h1>材料准备与人工协作</h1><p>仅供虚构教学资料，不判断真伪、资格或审批结果。上传材料和保存工单草稿需先登录。</p><p id="assistant-status" role="status"></p><section><h2>确认事项与教学规则</h2><select id="assistant-matter">{% for m in matters %}<option value="{{ m.matter_id }}" data-scenario="{{ m.scenario_id }}">{{ m.name }} · {{ m.scenario_name }}</option>{% endfor %}</select><button id="assistant-rules">查看规则版本</button><p id="assistant-rule-info"></p><button id="assistant-confirm" disabled>确认事项、情形及以上规则</button></section><section><h2>咨询与后续处理</h2><textarea id="assistant-question" maxlength="2000" rows="4" placeholder="描述你的教学问题；请勿输入真实个人信息"></textarea><button id="assistant-ask">核对问题</button><button id="assistant-draft">整理人工咨询草稿</button><p id="assistant-answer"></p><div id="assistant-actions"></div></section><section id="material-panel"><h2>教学材料辅助预检</h2><p>请先确认事项和规则；只上传明确标注的虚构图片或PDF，每份不超过10MB。字段需本人核对。</p><input id="material-file" type="file" accept="image/png,image/jpeg,application/pdf"><label><input id="material-consent" type="checkbox">我确认是虚构教学资料，并授权本次处理</label><button id="material-upload">上传教学材料</button><div id="material-list"></div><button id="material-precheck">按已确认规则辅助预检</button><pre id="material-result"></pre></section></main></body></html>
