<div class="filters"><label>标题<input name="title" maxlength="150" required></label><label>事项<select name="matter_id" required>{% for key,name in matters.items() %}{% if allows('knowledge.manage',key) %}<option value="{{ key }}">{{ name }}</option>{% endif %}{% endfor %}</select></label><label>适用情形（须与事项对应）<select name="scenario_id" required>{% for key,name in matters.items() %}{% if allows('knowledge.manage',key) %}<option value="{{ scenarios[key] }}">{{ name }}：{{ '租赁居住' if key == 'residence-permit' else '普通设立' }}（示例）</option>{% endif %}{% endfor %}</select></label><label>类型<select name="kind">{% if not rule_only|default(false) %}<option value="guide">办事指南</option><option value="workflow">人工处理流程</option>{% endif %}<option value="checklist">材料清单</option><option value="rule">预检规则文本</option></select></label><label>规则版本<input name="rule_version" maxlength="80" placeholder="DEMO-2026-02" required></label><label>来源说明或地址<input name="source_uri" maxlength="1000" placeholder="例如：团队自编示例资料" required></label></div><label class="checkbox"><input type="checkbox" name="is_teaching" value="true" required>确认仅使用明确标注的示例或脱敏资料，不含真实个人材料</label>
