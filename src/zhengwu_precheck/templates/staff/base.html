<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ module_name }} · 政务易办</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/css/staff.css"></head>
<body><div class="staff-shell"><aside class="staff-sidebar"><a class="staff-brand" href="/staff"><span class="mark">易</span><span>政务易办<small>工作人员后台</small></span></a><span class="nav-label">工作空间</span><nav aria-label="后台导航"><a href="/staff">我的工作台</a>{% for item in modules %}<a href="/staff/{{ item.slug }}" {% if item.name == module_name %}aria-current="page"{% endif %}><span>{{ item.name }}</span>{% if item.batch == 4 %}<small>第四批</small>{% endif %}</a>{% endfor %}</nav><div class="sidebar-foot"><strong>按岗位及事项授权</strong><p>只处理授权范围内的数据。<br>教学环境不接收真实个人材料。</p><a href="/">办事人咨询入口</a></div></aside><div class="staff-main"><header class="staff-header"><span>服务协同工作空间 <small>教学环境</small></span><div class="user-tools"><strong>{{ identity.username }}</strong><form action="/staff/api/auth/refresh" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="link-button">续期登录</button></form><form action="/staff/api/auth/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="link-button">退出登录</button></form></div></header><main class="staff-content"><div class="page-heading"><div><p class="section-kicker">工作人员后台</p><h1>{{ module_name }}</h1></div><span class="batch-badge">知识与服务协同</span></div>{% block content %}{% endblock %}</main><footer class="staff-footer">教学资料与准备性提示不替代法定审批。</footer></div></div></body></html>
