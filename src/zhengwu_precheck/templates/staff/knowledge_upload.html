{% extends 'staff/base.html' %}{% block content %}<section class="panel"><h2>上传Markdown或PDF</h2><p>单文件最多20MB，PDF最多20页，正文最多50000字符。扫描页不会自动识别，需人工补充或客户批准的OCR。</p><form method="post" action="/staff/api/knowledge/uploads" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% include 'staff/knowledge_fields.html' %}<label>使用范围<select name="visibility"><option value="">按类型默认：人工流程仅工作人员，其他类型公开</option><option value="public">公开指南，可用于办事人问答（不适用于人工处理流程）</option><option value="staff">仅工作人员，禁止进入公开问答</option></select></label><p class="notice">人工处理流程必须仅工作人员可见；请选择“按类型默认”或“仅工作人员”，选择公开将被拒绝，不会进入办事人问答。</p><label>文件<input type="file" name="file" accept=".md,.pdf" required></label><button class="primary">上传并处理</button></form></section>{% endblock %}
